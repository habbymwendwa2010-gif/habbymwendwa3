
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Love Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #190c27, #541b50, #a52e68);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    overflow-x: hidden;
}

.heart {
    position: fixed;
    bottom: -40px;
    color: #ff8fbd;
    opacity: 0.5;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 0;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% { opacity: 0.6; }
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.container {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 2;
}

.card {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 32px 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
    animation: appear 0.6s ease;
    max-height: 92vh;
    overflow-y: auto;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.emoji {
    font-size: 52px;
    margin-bottom: 12px;
}

h1, h2 {
    font-family: 'Playfair Display', serif;
}

h1 {
    font-size: clamp(28px, 7vw, 38px);
    margin-bottom: 12px;
}

h2 {
    font-size: 27px;
    margin-bottom: 14px;
}

.subtitle {
    color: #f7dce9;
    line-height: 1.7;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 16px;
    margin: 9px 0;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

input::placeholder {
    color: #ead0e0;
}

input:focus {
    border-color: #ffacd0;
    box-shadow: 0 0 15px rgba(255,150,200,0.2);
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
}

button:active {
    transform: scale(0.97);
}

.primary-btn {
    width: 100%;
    padding: 16px;
    margin-top: 16px;
    border-radius: 15px;
    color: #761b50;
    background: linear-gradient(135deg, #ffd1e5, #ff91bd);
    box-shadow: 0 8px 22px rgba(255,100,170,0.2);
}

.primary-btn:hover {
    box-shadow: 0 10px 28px rgba(255,100,170,0.4);
    transform: translateY(-2px);
}

.message {
    min-height: 25px;
    margin-top: 14px;
    color: #ffd2e6;
    font-size: 14px;
}

.progress-area {
    margin: 20px 0;
    text-align: left;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    color: #f7dce9;
    font-size: 12px;
    margin-bottom: 8px;
}

.progress-track {
    height: 7px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff8fbd, #ffe0ec);
    border-radius: 20px;
    transition: width 0.5s ease;
}

.question {
    font-size: 23px;
    line-height: 1.4;
    margin: 22px 0;
}

.answers {
    display: grid;
    gap: 11px;
}

.answer {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    color: white;
    background: rgba(255,255,255,0.11);
    border: 1px solid rgba(255,255,255,0.15);
    text-align: left;
    line-height: 1.4;
}

.answer:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-2px);
}

.answer.selected {
    background: rgba(255,160,200,0.3);
    border-color: #ffacd0;
}

.answer:disabled {
    cursor: default;
    opacity: 0.8;
}

.hint {
    color: #ffd2e6;
    font-size: 14px;
    min-height: 42px;
    margin-top: 18px;
    line-height: 1.5;
}

.navigation {
    display: flex;
    gap: 12px;
    margin-top: 15px;
}

.nav-btn {
    flex: 1;
    padding: 13px;
    border-radius: 13px;
    background: rgba(255,255,255,0.13);
    color: white;
    border: 1px solid rgba(255,255,255,0.18);
}

.nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.footer {
    color: #f3cadd;
    font-size: 12px;
    margin-top: 24px;
}

.hidden {
    display: none;
}

/* FINAL LOVE SCREEN */

.love-finale {
    padding: 20px 0;
    animation: appear 1s ease;
}

.big-heart {
    font-size: 110px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 25px #ff77b7);
    margin-bottom: 15px;
}

.love-finale h1 {
    font-size: 42px;
    color: #ffd0e5;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #ff69a9;
}

.love-finale h2 {
    color: white;
    margin-top: 15px;
}

.love-finale p {
    color: #ffe3ef;
    line-height: 1.8;
    margin-top: 20px;
}

.heart-decoration {
    font-size: 32px;
    margin-top: 25px;
    animation: appear 2s ease;
}

.signature {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
}

@media(max-width: 420px) {
    body { padding: 12px; }
    .card {
        padding: 27px 18px;
        border-radius: 23px;
    }
    .question { font-size: 21px; }
}
</style>
</head>

<body>

<div class="container">
<div class="card">

    <!-- WELCOME SCREEN -->

    <section id="welcome">
        <div class="emoji">💌</div>

        <h1>A Little Surprise</h1>

        <p class="subtitle">
            Before we begin, I have two little questions for you.
            This special experience is waiting for you. ❤️
        </p>

        <input id="herName" type="text"
        placeholder="What is your name?">

        <input id="myName" type="text"
        placeholder="And what is my name?">

        <button class="primary-btn" onclick="checkNames()">
            Unlock the Surprise 💖
        </button>

        <p class="message" id="nameMessage"></p>
    </section>


    <!-- QUIZ SCREEN -->

    <section id="quiz" class="hidden">

        <div class="emoji">💕</div>

        <h2 id="welcomeMessage">Let's begin!</h2>

        <div class="progress-area">

            <div class="progress-label">
                <span>Our little journey</span>
                <span id="progressText">1 / 8</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

        </div>

        <div class="question" id="questionText"></div>

        <div class="answers" id="answers"></div>

        <p class="hint" id="hint" aria-live="polite"></p>

        <div class="navigation">
            <button class="nav-btn" id="backBtn"
            onclick="goBack()">
                ← Previous
            </button>
        </div>

        <p class="footer">
            Made with a little extra love ❤️
        </p>

    </section>


    <!-- FINAL SCREEN -->

    <section id="final" class="hidden">
    </section>

</div>
</div>


<script>

// CHANGE THIS TO YOUR CORRECT NAME IF NEEDED
const correctName = "Habby Mwendwa";

let herName = "";
let questionIndex = 0;
let advanceTimer = null;
let isLocked = false;


// ALL QUIZ QUESTIONS

const questions = [

    {
        question: "What was your first impression of me? 😊",
        answers: [
            { text: "He seems really sweet ❤️" },
            { text: "A little mysterious 🤭" },
            { text: "Someone worth knowing 💕" },
            { text: "I wasn't sure at first 😂" },
            {
                text: "I haven't decided yet 😅",
                negative: true,
                note: "That's okay! There's no rush to decide. 💗"
            }
        ]
    },

    {
        question: "What's your favourite thing about us?",
        answers: [
            { text: "The way we laugh together 😂" },
            { text: "Our conversations 💬" },
            { text: "The little moments ❤️" },
            { text: "Everything about our friendship 💞" },
            {
                text: "I'm still figuring that out 🤔",
                negative: true,
                note: "That's completely fine. Every connection grows in its own time. 🌷"
            }
        ]
    },

    {
        question: "If we could spend a day together, what would you choose?",
        answers: [
            { text: "A fun adventure 🌍" },
            { text: "Watching a movie 🍿" },
            { text: "Talking for hours 🌙" },
            { text: "Trying something new ✨" },
            {
                text: "Maybe another day 😄",
                negative: true,
                note: "No pressure. We can always find another time! 💗"
            }
        ]
    },

    {
        question: "What makes a moment special to you?",
        answers: [
            { text: "A thoughtful message 💌" },
            { text: "A good laugh 😂" },
            { text: "Feeling appreciated 🌹" },
            { text: "Being understood ❤️" },
            {
                text: "I'm not sure yet 🤭",
                negative: true,
                note: "That's okay. The little things can surprise us. 🌸"
            }
        ]
    },

    {
        question: "Which little surprise would make your day?",
        answers: [
            { text: "A sweet handwritten note 💌" },
            { text: "A favourite song 🎶" },
            { text: "A thoughtful gift 🎁" },
            { text: "A lovely conversation ☀️" },
            {
                text: "No surprise today 😂",
                negative: true,
                note: "Fair enough! Everyone has their own kind of perfect day. 💕"
            }
        ]
    },

    {
        question: "What should we always make time for?",
        answers: [
            { text: "Laughing together 😂" },
            { text: "Being honest with each other 🤝" },
            { text: "Making lovely memories 📸" },
            { text: "Supporting each other 🌷" },
            {
                text: "Let's see where life takes us 🌱",
                negative: true,
                note: "That's a lovely way to look at it. No need to rush anything. ❤️"
            }
        ]
    },

    {
        question: "Did this little quiz make you smile? 🥹",
        answers: [
            { text: "Yes, it really did! ❤️" },
            { text: "Of course! 😂💕" },
            { text: "It was actually so cute 🥰" },
            { text: "You made me smile 🤭" },
            {
                text: "Not quite, but it was sweet 😅",
                negative: true,
                note: "I'll take that as a little win! Thanks for playing. 💗"
            }
        ]
    },

    // THE FINAL QUESTION

    {
        question: "If you cheat on me, do you think you will continue experiencing this? 🥺",
        answers: [
            {
                text: "YES ❤️",
                note: "I hope we always choose honesty, respect and happiness. ❤️"
            },
            {
                text: "NO 💔",
                note: "Trust and honesty matter in every relationship. 💗"
            }
        ]
    }

];


// CHECK THE NAMES

function checkNames() {

    const herInput =
        document.getElementById("herName").value.trim();

    const myInput =
        document.getElementById("myName").value.trim();

    const message =
        document.getElementById("nameMessage");

    if (!herInput || !myInput) {
        message.textContent =
            "Please enter both names first. 💕";
        return;
    }

    const normalize = name =>
        name.toLowerCase().replace(/\s+/g, " ");

    if (normalize(myInput) !== normalize(correctName)) {
        message.textContent =
            "Hmm... that's not quite the right name. Try again! 😉";
        return;
    }

    herName = herInput;

    document.getElementById("welcome")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    document.getElementById("welcomeMessage")
        .textContent = `Welcome, ${herName}! 💖`;

    showQuestion();
}


// DISPLAY QUESTIONS

function showQuestion() {

    clearTimeout(advanceTimer);
    isLocked = false;

    const current = questions[questionIndex];

    document.getElementById("questionText")
        .textContent = current.question;

    document.getElementById("progressText")
        .textContent =
        `${questionIndex + 1} / ${questions.length}`;

    document.getElementById("progressFill")
        .style.width =
        `${((questionIndex + 1) / questions.length) * 100}%`;

    document.getElementById("hint")
        .textContent = "";

    document.getElementById("backBtn").disabled =
        questionIndex === 0;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    current.answers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer.text;

        button.onclick = () =>
            chooseAnswer(button, answer);

        answersContainer.appendChild(button);

    });
}


// HANDLE ANSWERS

function chooseAnswer(button, answer) {

    if (isLocked) return;

    const hint = document.getElementById("hint");

    // NEGATIVE ANSWERS ON NORMAL QUESTIONS
    if (answer.negative) {

        button.classList.add("selected");

        hint.textContent = answer.note;

        return;
    }

    // LOCK ANSWERS AFTER A POSITIVE OR FINAL ANSWER
    isLocked = true;

    const allButtons =
        document.querySelectorAll(".answer");

    allButtons.forEach(btn => {
        btn.disabled = true;
    });

    button.classList.add("selected");

    hint.textContent =
        answer.note || "A lovely choice! ❤️";

    // THE FINAL QUESTION ENDS THE QUIZ
    const isLastQuestion =
        questionIndex === questions.length - 1;

    if (isLastQuestion) {

        advanceTimer = setTimeout(() => {
            showFinal();
        }, 1800);

        return;
    }

    // AUTOMATICALLY MOVE TO NEXT QUESTION
    advanceTimer = setTimeout(() => {

        questionIndex++;

        showQuestion();

    }, 1600);

}


// GO BACK TO PREVIOUS QUESTION

function goBack() {

    if (questionIndex <= 0) return;

    clearTimeout(advanceTimer);

    questionIndex--;

    showQuestion();

}


// FINAL HEART SCREEN

function showFinal() {

    document.getElementById("quiz")
        .classList.add("hidden");

    const finalScreen =
        document.getElementById("final");

    finalScreen.classList.remove("hidden");

    finalScreen.innerHTML = `

        <div class="love-finale">

            <div class="big-heart">❤️</div>

            <h1>I LOVE YOU</h1>

            <h2>${escapeHTML(herName)} 💕</h2>

            <p>
                No matter what, may we always choose
                honesty, kindness, respect and happiness.
            </p>

            <div class="heart-decoration">
                💗 💖 💗
            </div>

            <p class="signature">
                You are special. Keep smiling! ❤️
            </p>

        </div>

    `;

}


// SAFELY DISPLAY THE NAME

function escapeHTML(value) {

    return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);

}


// FLOATING HEART ANIMATION

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent =
        ["❤", "💕", "💗", "♥"][
            Math.floor(Math.random() * 4)
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (14 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (6 + Math.random() * 7) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 14000);

}

setInterval(createHeart, 550);

</script>

</body>
</html>
